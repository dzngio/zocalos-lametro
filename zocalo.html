<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Zócalo · La Metro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --red:#ED1C24; --ink:#111111; --paper:#ffffff; }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body.preview{background:#2a2a2a}
  body.preview.bg-check{background:repeating-conic-gradient(#3a3a3a 0 25%,#2c2c2c 0 50%) 0 0/40px 40px}
  body.preview.bg-light{background:linear-gradient(135deg,#e9e6e1,#cfcac2)}
  body.preview.bg-dark{background:radial-gradient(ellipse at 40% 30%,#5a5550,#1d1b1a 70%)}
  .mono{font-family:"Geist Mono",ui-monospace,monospace}

  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
    font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- TEMAS ---------- */
  #stage[data-tema="rojo"]{
    --main-bg:var(--red); --main-fg:#fff; --line:rgba(255,255,255,.38);
    --kick-bg:var(--ink); --kick-fg:#fff; --dot:var(--red);
    --tick-bg:#fff; --tick-fg:var(--ink); --tick-name:var(--red); --sep:var(--red);
    --clock-bg:var(--ink); --clock-fg:#fff; --logo:#fff;
    --foot-bg:var(--ink); --foot-fg:#fff; --sq:var(--red); --sq2:#fff;
  }
  #stage[data-tema="negro"]{
    --main-bg:var(--ink); --main-fg:#fff; --line:rgba(255,255,255,.2);
    --kick-bg:var(--red); --kick-fg:#fff; --dot:#fff;
    --tick-bg:#fff; --tick-fg:var(--ink); --tick-name:var(--red); --sep:var(--red);
    --clock-bg:var(--red); --clock-fg:#fff; --logo:#fff;
    --foot-bg:var(--red); --foot-fg:#fff; --sq:var(--ink); --sq2:var(--red);
  }
  #stage[data-tema="blanco"]{
    --main-bg:#fff; --main-fg:var(--ink); --line:rgba(17,17,17,.16);
    --kick-bg:var(--red); --kick-fg:#fff; --dot:#fff;
    --tick-bg:var(--ink); --tick-fg:#fff; --tick-name:var(--red); --sep:var(--red);
    --clock-bg:var(--red); --clock-fg:#fff; --logo:var(--red);
    --foot-bg:var(--red); --foot-fg:#fff; --sq:#fff; --sq2:var(--red);
  }

  /* ---------- LAYOUT ---------- */
  .z{position:absolute;left:64px;right:64px;bottom:56px;display:flex;align-items:flex-end;gap:10px;visibility:hidden}
  .z *{box-sizing:border-box}

  /* QR */
  .qr{width:256px;flex:none;background:#fff;color:var(--ink);display:flex;flex-direction:column}
  .qr.off{display:none}
  .qr-head{padding:16px 18px 6px}
  .qr-head .l1{display:block;font-family:"Geist Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
  .qr-head .l2{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin-top:4px;text-transform:uppercase}
  .qr-img{position:relative;padding:6px 18px 14px;overflow:hidden}
  .qr-img img{display:block;width:220px;height:220px}
  .qr-scan{position:absolute;left:18px;right:18px;height:3px;top:6px;background:var(--red);box-shadow:0 0 14px 2px rgba(237,28,36,.55);opacity:0}
  .qr-foot{height:60px;background:var(--foot-bg);color:var(--foot-fg);display:flex;align-items:center;gap:10px;padding:0 18px;transition:background-color .5s,color .5s;overflow:hidden}
  .qr-foot b{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap}
  .qr-foot small{font-family:"Geist Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.06em;line-height:1.15;text-transform:uppercase}

  /* STACK */
  .stack{flex:1;min-width:0;display:flex;flex-direction:column}
  .row-kick{height:48px;display:flex;align-items:flex-end;justify-content:space-between}
  .kick{height:42px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--kick-bg);color:var(--kick-fg);
    font-family:"Geist Mono",monospace;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:background-color .5s,color .5s}
  .kick .dot{width:10px;height:10px;border-radius:50%;background:var(--dot);animation:pulse 1.4s ease-in-out infinite}
  .kick.empty{display:none}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .squares{position:relative;width:96px;height:48px;margin-right:164px;flex:none}
  .squares i{position:absolute;width:32px;height:24px;background:var(--sq);transition:background-color .5s}
  .squares i:nth-child(1){left:64px;top:0;background:var(--sq2)}
  .squares i:nth-child(2){left:32px;top:24px}
  .squares i:nth-child(3){left:0;top:24px;background:var(--sq2)}

  .main{position:relative;height:144px;display:flex;align-items:stretch;background:var(--main-bg);color:var(--main-fg);overflow:hidden;transition:background-color .5s,color .5s}
  .grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);transform-origin:top}
  .grid i:nth-child(1){left:33%}
  .grid i:nth-child(2){left:62%}
  .grid i:nth-child(3){left:0;right:260px;width:auto;height:1px;bottom:auto;top:14px;transform-origin:left}
  .main-txt{position:relative;flex:1;min-width:0;padding:10px 40px 0;display:flex;flex-direction:column;justify-content:center}
  .headline{width:100%;font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:1;white-space:nowrap;overflow:hidden;padding:.12em 0 .06em}
  .headline.two{white-space:normal;line-height:.98}
  #stage[data-tema="blanco"] .main,#stage[data-tema="blanco"] .qr{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.12)}
  .w{display:inline-block;overflow:hidden;vertical-align:top;padding-top:.14em;margin-top:-.14em}
  .w>span{display:inline-block}
  .persona{display:none}
  [data-modo="persona"] .headline{display:none}
  [data-modo="persona"] .persona{display:block}
  .pname{font-size:66px;font-weight:800;letter-spacing:-.035em;line-height:1.05;white-space:nowrap;overflow:hidden}
  .pname em{font-style:normal;font-family:"Geist Mono",monospace;font-size:19px;font-weight:500;letter-spacing:0;margin-left:18px;opacity:.85;vertical-align:middle}
  .prol{font-family:"Geist Mono",monospace;font-size:19px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:8px;opacity:.9;white-space:nowrap;overflow:hidden}
  .logo{width:260px;flex:none;border-left:1px solid var(--line);display:grid;place-items:center;color:var(--logo);transition:color .5s}
  .logo svg{width:184px;height:auto;fill:currentColor;display:block}

  .row-tick{height:60px;display:flex}
  .row-tick.off{display:none}
  .tick-label{flex:none;display:flex;align-items:center;padding:0 20px;background:var(--kick-bg);color:var(--kick-fg);
    font-family:"Geist Mono",monospace;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:background-color .5s,color .5s}
  .tick{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--tick-bg);color:var(--tick-fg);transition:background-color .5s,color .5s}
  .track{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;will-change:transform}
  .set{display:flex;align-items:center}
  .item{font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:-.005em;padding:0 22px}
  .item b{font-weight:800;color:var(--tick-name)}
  .sep{width:9px;height:9px;background:var(--sep);flex:none}
  .clock{width:260px;flex:none;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--clock-bg);color:var(--clock-fg);
    font-family:"Geist Mono",monospace;font-size:28px;font-weight:600;letter-spacing:.02em;transition:background-color .5s,color .5s}
  .clock.off{visibility:hidden}
  .clock .c{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>

<script>
(() => {
  const KEY = 'lametro-zocalo-state';
  const DEF = {
    visible: true,
    tema: 'rojo',            // rojo | negro | blanco
    modo: 'titular',         // titular | persona
    kicker: 'En vivo desde La Metro',
    titular: 'Mostrá lo que hacés',
    nombre: 'Julian Giordana',
    handle: '@dzn_gio',
    rol: 'Charla abierta · Diseño gráfico',
    qrOn: true,
    qrL1: 'Escaneá e inscribite',
    qrL2: 'Ciclo 2027',
    qrPie: '-60%',
    qrPieSub: 'en tu\nmatrícula',
    tickerOn: true,
    tickerLabel: 'Inscripciones 2027',
    ticker: 'La Metro: Inscripciones 2027 abiertas\nMatrícula: 60% de descuento escaneando el QR\nCarreras: Diseño gráfico · Audiovisual · Fotografía',
    tickerVel: 90,
    relojOn: true,
    escala: 1
  };

  const $ = id => document.getElementById(id);
  const stage = $('stage'), z = $('z');
  const params = new URLSearchParams(location.search);
  if (params.has('preview')) { document.body.classList.add('preview'); document.body.classList.add('bg-' + (params.get('bg') || 'dark')); }

  function fromParams() {
    const o = {};
    for (const [k, v] of params) {
      if (!(k in DEF)) continue;
      if (typeof DEF[k] === 'boolean') o[k] = !(v === '0' || v === 'false' || v === 'no');
      else if (typeof DEF[k] === 'number') o[k] = parseFloat(v);
      else o[k] = k === 'ticker' ? v.split('|').join('\n') : v;
    }
    return o;
  }
  function stored() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }

  // Con parámetros en la URL, la URL manda (zócalo fijo). Sin parámetros, sigue al panel de control.
  const fixed = [...params.keys()].some(k => k in DEF);
  let S = Object.assign({}, DEF, fixed ? {} : stored(), fromParams());
  let shown = false;

  /* ---------- escala ---------- */
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth - 1920 * s) / 2 + 'px';
    stage.style.top = (innerHeight - 1080 * s) / 2 + 'px';
  }
  addEventListener('resize', fit); fit();

  /* ---------- helpers de animación ---------- */
  const IO = 'cubic-bezier(.77,0,.18,1)', OUT = 'cubic-bezier(.16,1,.3,1)', IN = 'cubic-bezier(.6,0,.84,0)';
  const A = (el, kf, o) => el ? el.animate(kf, Object.assign({ fill: 'both', easing: OUT }, o)) : null;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- titular ---------- */
  const headline = $('headline');
  function setHeadline(text) {
    headline.innerHTML = String(text).trim().split(/\s+/).filter(Boolean)
      .map(w => `<span class="w"><span>${esc(w)}</span></span>`).join(' ');
    const k = S.escala || 1;
    headline.classList.remove('two');
    let size = 92 * k;
    headline.style.fontSize = size + 'px';
    while (headline.scrollWidth > headline.clientWidth + 1 && size > 60 * k) { size -= 2; headline.style.fontSize = size + 'px'; }
    if (headline.scrollWidth > headline.clientWidth + 1) {
      // No entra en una línea: pasa a dos líneas
      headline.classList.add('two');
      size = 62 * k; headline.style.fontSize = size + 'px';
      while ((headline.scrollHeight > 128 || headline.scrollWidth > headline.clientWidth + 1) && size > 30) { size -= 2; headline.style.fontSize = size + 'px'; }
    }
  }
  function fitPersona() {
    const n = document.querySelector('.pname');
    let size = 66 * (S.escala || 1);
    n.style.fontSize = size + 'px';
    while (n.scrollWidth > n.clientWidth + 1 && size > 34) { size -= 2; n.style.fontSize = size + 'px'; }
  }
  function textEls() {
    return S.modo === 'persona'
      ? [$('pName'), $('pHandle'), $('pRol')]
      : [...headline.querySelectorAll('.w>span')];
  }
  function textIn(delay = 0) {
    textEls().forEach((el, i) => A(el, [{ transform: 'translateY(115%)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 700, delay: delay + i * 70 }));
  }
  function textOut() {
    const els = textEls();
    const anims = els.map((el, i) => A(el, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-115%)', opacity: 0 }],
      { duration: 320, delay: i * 35, easing: IN }));
    return Promise.all(anims.map(a => a.finished)).catch(() => {});
  }
  function renderText() {
    if (S.modo === 'persona') {
      $('pName').textContent = S.nombre; $('pHandle').textContent = S.handle; $('pRol').textContent = S.rol;
      fitPersona();
    } else setHeadline(S.titular);
  }

  /* ---------- ticker ---------- */
  const track = $('track'), tick = $('tick');
  let tx = 0, setW = 0, last = 0;
  function buildTicker() {
    const items = String(S.ticker).split('\n').map(s => s.trim()).filter(Boolean).map(line => {
      const m = line.match(/^([^:]{1,40}):\s*(.*)$/);
      return `<span class="item">${m ? `<b>${esc(m[1])}:</b> ${esc(m[2])}` : esc(line)}</span><i class="sep"></i>`;
    }).join('');
    track.innerHTML = `<div class="set">${items || '<span class="item">&nbsp;</span>'}</div>`;
    const one = track.firstElementChild;
    setW = one.getBoundingClientRect().width / (stage.getBoundingClientRect().width / 1920 || 1);
    const need = Math.ceil((tick.clientWidth + setW) / Math.max(setW, 1)) + 1;
    for (let i = 1; i < need; i++) track.appendChild(one.cloneNode(true));
    if (setW) tx = tx % setW;
  }
  function loop(t) {
    const dt = last ? Math.min((t - last) / 1000, .1) : 0; last = t;
    if (setW > 0) { tx -= (S.tickerVel || 0) * dt; if (-tx >= setW) tx += setW; track.style.transform = `translate3d(${tx}px,0,0)`; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- reloj ---------- */
  function clock() {
    const d = new Date(), h = String(d.getHours()).padStart(2, '0'), m = String(d.getMinutes()).padStart(2, '0');
    $('clock').innerHTML = `${h}<span class="c">:</span>${m}`;
  }
  clock(); setInterval(clock, 1000 * 5);

  /* ---------- QR: barrido de atención ---------- */
  setInterval(() => {
    if (!shown || !S.qrOn) return;
    A($('qrScan'), [{ top: '6px', opacity: 0 }, { opacity: 1, offset: .1 }, { opacity: 1, offset: .9 }, { top: '232px', opacity: 0 }], { duration: 1400, easing: 'ease-in-out', fill: 'none' });
    A($('qrFoot').firstElementChild, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 600, delay: 1300, fill: 'none' });
  }, 9000);

  /* ---------- entrada / salida ---------- */
  function enter() {
    shown = true;
    z.style.visibility = 'visible';
    const sq = [...$('squares').children], lines = [...$('grid').children];
    A($('qr'), [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 750, easing: IO });
    A($('qrImg'), [{ opacity: 0, transform: 'scale(.82)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 380 });
    A($('qrFoot'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 600, delay: 520, easing: IO });
    A($('main'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 850, delay: 160, easing: IO });
    A($('tickRow'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 850, delay: 300, easing: IO });
    A($('kick'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 550, delay: 620, easing: IO });
    lines.forEach((l, i) => A(l, [{ transform: i === 2 ? 'scaleX(0)' : 'scaleY(0)' }, { transform: 'none' }], { duration: 900, delay: 450 + i * 90, easing: IO }));
    sq.forEach((s, i) => A(s, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 420, delay: 820 + i * 90, easing: 'cubic-bezier(.34,1.56,.64,1)' }));
    A($('logo'), [{ opacity: 0, transform: 'translateY(30%)' }, { opacity: 1, transform: 'none' }], { duration: 650, delay: 760 });
    A($('clock'), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 900 });
    textIn(620);
  }
  function exit() {
    shown = false;
    const sq = [...$('squares').children].reverse();
    sq.forEach((s, i) => A(s, [{ transform: 'scale(1)' }, { transform: 'scale(0)' }], { duration: 220, delay: i * 50, easing: IN }));
    textOut();
    A($('logo'), [{ opacity: 1 }, { opacity: 0 }], { duration: 250 });
    A($('kick'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 100% 0 0)' }], { duration: 380, delay: 80, easing: IO });
    A($('main'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 0 100%)' }], { duration: 650, delay: 220, easing: IO });
    A($('tickRow'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 0 100%)' }], { duration: 650, delay: 300, easing: IO });
    A($('qrFoot'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 100% 0 0)' }], { duration: 400, delay: 150, easing: IO });
    const last = A($('qr'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)' }], { duration: 600, delay: 420, easing: IO });
    last.finished.then(() => { if (!shown) z.style.visibility = 'hidden'; }).catch(() => {});
  }

  /* ---------- render ---------- */
  let busy = Promise.resolve();
  function render(prev) {
    stage.dataset.tema = S.tema;
    $('kickTxt').textContent = S.kicker;
    $('kick').classList.toggle('empty', !S.kicker);
    $('qr').classList.toggle('off', !S.qrOn);
    $('qrL1').textContent = S.qrL1; $('qrL2').textContent = S.qrL2;
    $('qrPie').textContent = S.qrPie;
    $('qrPieSub').innerHTML = esc(S.qrPieSub).replace(/\n/g, '<br>');
    $('tickRow').classList.toggle('off', !S.tickerOn);
    $('tickLabel').textContent = S.tickerLabel; $('tickLabel').style.display = S.tickerLabel ? '' : 'none';
    $('clock').classList.toggle('off', !S.relojOn);

    const textChanged = !prev || prev.modo !== S.modo || prev.titular !== S.titular || prev.nombre !== S.nombre
      || prev.handle !== S.handle || prev.rol !== S.rol || prev.escala !== S.escala;
    const layoutChanged = !prev || prev.qrOn !== S.qrOn || prev.tickerLabel !== S.tickerLabel || prev.relojOn !== S.relojOn;

    if (!prev || prev.ticker !== S.ticker || layoutChanged || prev.tickerOn !== S.tickerOn) buildTicker();

    const wantShow = !!S.visible;
    if (!prev) { renderText(); if (wantShow) enter(); return; }

    if (wantShow && !shown) { renderText(); enter(); return; }
    if (!wantShow && shown) { exit(); return; }
    if (!wantShow) { renderText(); return; }

    if (textChanged) {
      const old = prev;
      busy = busy.then(async () => {
        const modoNow = S.modo; S.modo = old.modo; await textOut(); S.modo = modoNow;
        stage.dataset.modo = S.modo; renderText(); textIn(0);
      });
    } else if (layoutChanged) renderText();
  }

  function update(next) {
    const prev = Object.assign({}, S);
    S = Object.assign({}, S, next);
    if (!(prev.modo !== S.modo && shown && S.visible)) stage.dataset.modo = S.modo;
    render(prev);
  }

  /* ---------- comunicación con el panel ---------- */
  if (!fixed) {
    try { const bc = new BroadcastChannel('lametro-zocalos'); bc.onmessage = e => e.data && e.data.state && update(e.data.state); } catch {}
    addEventListener('storage', e => { if (e.key === KEY && e.newValue) try { update(JSON.parse(e.newValue)); } catch {} });
  }
  addEventListener('message', e => { if (e.data && e.data.zocalo) update(e.data.zocalo); });
  addEventListener('keydown', e => { if (e.code === 'Space') update({ visible: !shown }); });

  stage.dataset.modo = S.modo;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => render(null), 150));
})();
</script>
</body>
</html>
