<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gracias por acompañarnos · La Metro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800;900&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Escena full-screen 1920×1080 para OBS. Colores idénticos al zócalo.
    Composición tomada de la presentación "Nadie contrata lo que no ve":
    fila de etiquetas mono arriba, titular gigante de interlineado apretado con la
    última línea en color de contraste, fila de datos en columnas debajo.
    Anclajes compartidos con el zócalo: márgenes Title Safe (96 / 54 / 60),
    columna derecha de 300 (QR + lametro/reloj), ticker de 72 a lo ancho.
  */
  :root{
    --red:#FF1E27; --ink:#09090B; --white:#FFFFFF; --g1:#18181B; --g2:#27272A;
    --ease:cubic-bezier(.16,1,.3,1);
    --cell:120px;
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
    font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- VARIANTES ---------- */
  [data-escena="inicio"]{
    --bg:var(--ink); --fg:var(--white); --accent:var(--red); --dim:rgba(255,255,255,.5); --rule:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.05); --ghost:rgba(255,255,255,.035);
    --tick-bg:var(--red); --tick-fg:#fff; --sep:#fff; --tlab-bg:var(--white); --tlab-fg:var(--ink);
    --foot-bg:var(--red); --sq-a:var(--white); --sq-b:var(--red); --scan:rgba(255,30,39,.4) }
  [data-escena="fin"]{
    --bg:var(--red); --fg:var(--ink); --accent:var(--white); --dim:rgba(9,9,11,.6); --rule:rgba(9,9,11,.28);
    --line:rgba(9,9,11,.07); --ghost:rgba(9,9,11,.06);
    --tick-bg:var(--ink); --tick-fg:#fff; --sep:var(--red); --tlab-bg:var(--white); --tlab-fg:var(--ink);
    --foot-bg:var(--ink); --sq-a:var(--ink); --sq-b:var(--white); --scan:rgba(255,255,255,.3) }
  #stage{background:var(--bg);color:var(--fg)}

  /* ---------- FONDO (loops exactos) ---------- */
  /* Grilla: avanza exactamente una celda por ciclo */
  .grid{position:absolute;left:calc(var(--cell) * -1);top:calc(var(--cell) * -1);width:calc(1920px + var(--cell) * 2);height:calc(1080px + var(--cell) * 2);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:var(--cell) var(--cell);background-position:96px 54px;
    will-change:transform;animation:drift 32s linear infinite}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--cell),var(--cell),0)}}
  /* Texto fantasma gigante: dos copias idénticas y -50% */
  .ghost{position:absolute;left:0;top:250px;display:flex;white-space:nowrap;will-change:transform;animation:ghost 120s linear infinite;
    font-size:440px;font-weight:900;letter-spacing:-.06em;line-height:1;color:var(--ghost);text-transform:uppercase;pointer-events:none}
  .ghost span{padding-right:.4em}
  @keyframes ghost{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
  .scan{position:absolute;left:0;right:0;top:0;height:1px;background:var(--scan);will-change:transform;animation:scan 16s linear infinite}
  @keyframes scan{from{transform:translate3d(0,-20px,0)}to{transform:translate3d(0,1100px,0)}}

  /* ---------- CABECERA (como la presentación) ---------- */
  .head{position:absolute;left:96px;right:96px;top:54px;height:24px;display:grid;grid-template-columns:480px 480px 1fr auto;align-items:center;
    font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .head .dim{color:var(--dim)}
  .head .c1{display:flex;align-items:center;gap:12px}
  .rec{width:11px;height:11px;border-radius:50%;background:var(--red);animation:blink 1.2s steps(1) infinite;flex:none}
  [data-escena="fin"] .rec{border-radius:0;background:var(--ink);animation:none}
  @keyframes blink{50%{opacity:0}}
  .head .c4{text-align:right}
  .rule{position:absolute;left:96px;right:96px;top:98px;height:1px;background:var(--rule);transform-origin:left;animation:grow 1.2s var(--ease) .1s both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}

  /* ---------- TITULAR ---------- */
  .hl{position:absolute;left:96px;width:1380px;bottom:300px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.055em;line-height:.84;color:var(--fg)}
  .hl .m{display:block;overflow:hidden;padding:.06em 0 .02em;margin:-.06em 0 -.02em}
  .hl .m>span{display:inline-block;white-space:nowrap}
  .hl .m:last-child>span{color:var(--accent)}
  .cluster{position:absolute;width:96px;height:64px}
  .cluster i{position:absolute;width:32px;height:32px;animation:pop 7s var(--ease) infinite}
  .cluster i:nth-child(1){left:64px;top:0;background:var(--sq-a)}
  .cluster i:nth-child(2){left:32px;top:32px;background:var(--sq-b);animation-delay:.25s}
  .cluster i:nth-child(3){left:0;top:32px;background:var(--sq-a);animation-delay:.12s}
  @keyframes pop{0%,10%{transform:scale(1)}16%{transform:scale(0)}26%,100%{transform:scale(1)}}

  /* ---------- FILA DE DATOS ---------- */
  .info{position:absolute;left:96px;width:1388px;top:820px;height:88px;display:grid;grid-template-columns:520px 300px 1fr;column-gap:40px;align-items:start}
  .sub{margin:0;font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.16}
  .mono2{font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.45}
  .mono2 span{display:block}
  .mono2 .dim{color:var(--dim)}
  .slot{justify-self:end;text-align:right}
  .count small{display:block;font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
  .count b{display:block;font-family:"Geist Mono",monospace;font-size:96px;font-weight:600;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
  .count b i{font-style:normal;color:var(--red)}
  .count.done b{animation:blink 1s steps(1) infinite}
  .signal{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-top:10px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:34px}
  .bars i{width:8px;height:100%;background:var(--red);transform-origin:bottom;animation:eq 1.2s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:-.2s}.bars i:nth-child(3){animation-delay:-.4s}.bars i:nth-child(4){animation-delay:-.6s}.bars i:nth-child(5){animation-delay:-.8s}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  .signal span{white-space:nowrap;font-family:"Geist Mono",monospace;font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

  /* Cierre: lista de redes con filetes (como la slide "Gracias.") */
  .links{position:absolute;left:96px;width:1388px;top:600px;display:none}
  [data-escena="fin"] .links{display:block}
  .links a{display:grid;grid-template-columns:52px 1fr auto;align-items:center;height:68px;border-top:1px solid var(--rule);color:var(--fg);text-decoration:none}
  .links a:last-child{border-bottom:1px solid var(--rule)}
  .links svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square}
  .links b{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .links small{font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
  [data-escena="fin"] .hl{bottom:500px}
  [data-escena="fin"] .info{top:846px}

  /* ---------- COLUMNA DERECHA (igual al zócalo) ---------- */
  .col{position:absolute;right:96px;width:300px;bottom:60px;display:flex;flex-direction:column;gap:8px}
  .qr{background:#fff;color:var(--ink)}
  .qr.off{display:none}
  .qr-head{padding:20px 28px 14px}
  .qr-head .l1{display:block;font-family:"Geist Mono",monospace;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
  .qr-head .l2{display:block;font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:6px;text-transform:uppercase}
  .qr-img{position:relative;padding:4px 28px 20px;overflow:hidden}
  .qr-img img{display:block;width:244px;height:244px}
  .qr-scan{position:absolute;left:28px;right:28px;top:4px;height:3px;background:var(--red);box-shadow:0 0 16px 2px rgba(255,30,39,.5);will-change:transform,opacity;animation:qrscan 8s ease-in-out infinite}
  @keyframes qrscan{0%,72%{transform:translate3d(0,0,0);opacity:0}74%{opacity:1}96%{transform:translate3d(0,240px,0);opacity:1}100%{transform:translate3d(0,240px,0);opacity:0}}
  .qr-foot{height:72px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--foot-bg);color:#fff}
  .qr-foot b{font-size:40px;font-weight:900;letter-spacing:-.05em;line-height:1}
  .qr-foot small{font-family:"Geist Mono",monospace;font-size:13px;font-weight:700;letter-spacing:.06em;line-height:1.2;text-transform:uppercase}

  .brand{background:var(--ink);display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--g2)}
  .brand .logo{height:72px;display:grid;place-items:center;border-bottom:1px solid var(--g2)}
  .brand .logo svg{width:170px;height:auto;fill:#fff;display:block}
  .clock{position:relative;height:72px;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;
    font-family:"Geist Mono",monospace;font-size:36px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .clock .colon{display:flex;flex-direction:column;gap:8px;animation:tick 2s var(--ease) infinite}
  .clock .colon b{width:6px;height:6px;background:var(--red)}
  .clock .sec{position:absolute;left:0;bottom:0;height:3px;background:var(--red);width:0;transition:width 1s linear}
  @keyframes tick{0%,45%{opacity:1}55%,95%{opacity:.25}100%{opacity:1}}

  /* ---------- TICKER ---------- */
  .ticker{position:absolute;left:96px;right:404px;bottom:60px;height:72px;display:flex;background:var(--tick-bg);color:var(--tick-fg);overflow:hidden}
  .t-label{flex:none;display:flex;align-items:center;padding:0 24px;background:var(--tlab-bg);color:var(--tlab-fg);font-family:"Geist Mono",monospace;font-size:17px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .t-win{position:relative;flex:1;overflow:hidden}
  .track{position:absolute;left:0;top:0;bottom:0;display:flex;will-change:transform;animation:marquee 40s linear infinite}
  .grp{display:flex;align-items:center;flex:none;height:100%}
  .item{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.005em;padding:0 30px;white-space:nowrap;line-height:1}
  .sepq{width:10px;height:10px;background:var(--sep);flex:none}
  @keyframes marquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

  /* ---------- ENTRADA (una sola vez) ---------- */
  .in{animation:rise .9s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translate3d(0,30px,0)}to{opacity:1;transform:none}}
  .wipe{animation:wipe 1s var(--ease) both}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s!important;animation-iteration-count:1!important} }
</style>
</head>

    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth - 1920 * s) / 2 + 'px';
    stage.style.top = (innerHeight - 1080 * s) / 2 + 'px';
  }
  addEventListener('resize', fit); fit();

  /* ---------- textos por defecto ---------- */
  const D = escena === 'inicio' ? {
    volanta: 'En vivo desde La Metro',
    titulo: 'Ya comenzamos.',
    subtitulo: 'Quedate, en un momento arrancamos.',
    autor: 'La Metro', rol: 'Diseño y audiovisual',
    etiqueta: 'Inscripciones 2027',
    fondo: 'La Metro',
    ticker: 'Inscripciones 2027 escaneando el QR|Carreras: Diseño gráfico · Audiovisual · Fotografía|60% off en tu matrícula|La Metro'
  } : {
    volanta: 'Transmisión finalizada',
    titulo: 'Gracias por|acompañarnos.',
    subtitulo: 'Nos vemos en la próxima.',
    autor: 'La Metro', rol: 'Diseño y audiovisual',
    etiqueta: 'Hasta la próxima',
    fondo: 'Gracias',
    ticker: 'Gracias por acompañarnos|Inscripciones 2027 abiertas|60% off en tu matrícula escaneando el QR|@lametro|lametro.edu.ar'
  };

  /* ---------- configuración vigente ---------- */
  const urlCfg = {};
  for (const [k, v] of P) if (k !== 'preview' && k !== 'bg' && k !== 'api' && k !== 'v') urlCfg[k] = v;
  const pick = s => Object.assign({}, (s && s.comun) || {}, (s && s[escena]) || {});
  let panel = {};
  try { panel = pick(JSON.parse(localStorage.getItem(SKEY))); } catch {}
  let cfg = {};
  // Un campo vacío desde el panel queda vacío (ej. ocultar una red); sin dato, usa el texto por defecto.
  const get = (k, d) => { const v = cfg[k]; return (v === undefined || v === null) ? d : String(v); };
  const off = v => v === '0' || v === 'false' || v === false;

  const hl = $('hl'), slot = $('slot');
  let target = null;
  const urlTarget = (() => {               // ?min=… se calcula una sola vez al cargar
    if (P.has('min') && !isNaN(parseFloat(P.get('min')))) return Date.now() + parseFloat(P.get('min')) * 60000;
    return null;
  })();
  const loadTime = new Date();

  function horaATarget(hasta) {
    if (!/^\d{1,2}:\d{2}$/.test(hasta || '')) return null;
    const [h, m] = hasta.split(':').map(Number), t = new Date(); t.setHours(h, m, 0, 0);
    if (t.getTime() < Date.now() - 6 * 3600e3) t.setDate(t.getDate() + 1);
    return t.getTime();
  }

  /* ---------- titular ---------- */
  function fitHeadline(titulo) {
    const maxW = 1380, maxH = escena === 'inicio' ? 560 : 400;
    const manual = titulo.includes('|');
    const words = titulo.trim().split(/\s+/);
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
    hl.appendChild(probe);
    const w = t => { probe.textContent = t; return probe.offsetWidth; };
    let size = 300, lines = [];
    for (; size >= 60; size -= 4) {
      hl.style.fontSize = size + 'px';
      if (manual) lines = titulo.split('|').map(s => s.trim()).filter(Boolean);
      else {
        lines = []; let cur = '';
        for (const word of words) {
          const test = cur ? cur + ' ' + word : word;
          if (cur && w(test) > maxW) { lines.push(cur); cur = word; } else cur = test;
        }
        if (cur) lines.push(cur);
      }
      if (!lines.length || (Math.max(...lines.map(w)) <= maxW && lines.length * size * .84 <= maxH)) break;
    }
    probe.remove();
    hl.innerHTML = lines.map(l => `<span class="m"><span>${esc(l)}</span></span>`).join('');
  }
  function animateHeadline() {
    [...hl.querySelectorAll('.m>span')].forEach((s, i) => s.animate(
      [{ transform: 'translate3d(0,105%,0)' }, { transform: 'none' }],
      { duration: 1100, delay: 150 + i * 110, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' }));
  }
  function placeCluster() {
    const spans = [...hl.querySelectorAll('.m>span')], c = $('cluster');
    if (!spans.length) { c.style.display = 'none'; return; }
    c.style.display = '';
    const s = spans[spans.length - 1], m = s.parentElement;
    const size = parseFloat(hl.style.fontSize);
    const end = hl.offsetLeft + s.offsetLeft + s.offsetWidth;
    const prev = spans.length > 1 ? spans[spans.length - 2] : null;
    const prevEnd = prev ? hl.offsetLeft + prev.offsetLeft + prev.offsetWidth : 0;
    if (!prev || prevEnd < end - 140) {
      // Arriba del final de la última línea (como los cuadrados sobre el logo del zócalo)
      c.style.left = (end - 96) + 'px';
      c.style.top = (hl.offsetTop + m.offsetTop - 64 + size * 0.06) + 'px';
    } else if (end + 24 + 96 <= 1450) {
      c.style.left = (end + 24) + 'px';
      c.style.top = (hl.offsetTop + m.offsetTop + size * 0.14) + 'px';
    } else c.style.display = 'none';
  }

  /* ---------- ticker: 2 copias idénticas y -50% → loop exacto ---------- */
  function buildTicker() {
    const items = get('ticker', D.ticker).split(/\||\n/).map(s => s.trim()).filter(Boolean)
      .map(s => `<span class="item">${esc(s)}</span><i class="sepq"></i>`).join('');
    const track = $('track'), win = $('tWin');
    track.innerHTML = `<div class="grp">${items || '<span class="item">&nbsp;</span>'}</div>`;
    const grp = track.firstElementChild;
    let guard = 0;
    while (grp.offsetWidth < win.offsetWidth && guard++ < 20) grp.insertAdjacentHTML('beforeend', items);
    track.appendChild(grp.cloneNode(true));
    track.style.animationDuration = (grp.offsetWidth / (parseFloat(get('vel', '90')) || 90)) + 's';
  }

  const ICON = {
    ig: '<svg viewBox="0 0 34 34"><rect x="4" y="4" width="26" height="26"/><circle cx="17" cy="17" r="6"/><path d="M24.5 9.5h.01"/></svg>',
    web: '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="13"/><path d="M4 17h26M17 4c4 4 5.5 8.5 5.5 13S21 26 17 30M17 4c-4 4-5.5 8.5-5.5 13S13 26 17 30"/></svg>',
    cta: '<svg viewBox="0 0 34 34"><path d="M5 9h24v16H5zM5 14h24M11 20h6"/></svg>'
  };

  /* ---------- pinta todo el contenido ---------- */
  function render() {
    cfg = Object.assign({}, panel, urlCfg);

    $('volanta').textContent = get('volanta', D.volanta);
    $('sub').textContent = get('subtitulo', D.subtitulo);
    $('who').innerHTML = `<span>${esc(get('autor', D.autor))}</span><span class="dim">${esc(get('rol', D.rol))}</span>`;
    const g = esc(get('fondo', D.fondo));
    $('ghost').innerHTML = `<span>${g}</span><span>${g}</span><span>${g}</span><span>${g}</span>`;

    fitHeadline(get('titulo', D.titulo).replace(/\n/g, '|'));
    animateHeadline();
    requestAnimationFrame(placeCluster);

    if (escena === 'inicio') {
      // Cuenta regresiva: URL (?min / ?hasta) o panel (timerModo: no | min | hasta)
      const modo = urlTarget ? 'url' : P.has('hasta') ? 'hasta' : get('timerModo', 'no');
      target = modo === 'url' ? urlTarget
        : modo === 'hasta' ? horaATarget(get('hasta', ''))
        : modo === 'min' && Number(cfg.target) ? Number(cfg.target) : null;
      slot.innerHTML = target
        ? `<div class="count" id="count"><small id="countLbl">${esc(get('etiquetaTimer', 'Empezamos en'))}</small><b id="countNum">00<i>:</i>00</b></div>`
        : `<div class="count"><small>${esc(get('etiquetaEstado', 'Estado'))}</small><div class="signal"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><span>${esc(get('estado', 'Preparando señal // en instantes'))}</span></div></div>`;
    } else {
      const rows = [
        ['ig', get('ig', '@lametro'), get('igLabel', 'Instagram')],
        ['web', get('web', 'lametro.edu.ar'), get('webLabel', 'Web')],
        ['cta', get('cta', 'Inscripciones ciclo 2027'), get('ctaLabel', '-60% en tu matrícula')]
      ].filter(r => r[1]);
      $('links').innerHTML = rows.map(([k, t, l]) => `<a>${ICON[k]}<b>${esc(t)}</b><small>${esc(l)}</small></a>`).join('');
      slot.innerHTML = `<div class="mono2"><span>${esc(get('cierre', 'Fin de la transmisión'))}</span><span class="dim" id="endTime"></span></div>`;
    }

    $('qr').classList.toggle('off', off(get('qr', '1')));
    $('qrL1').textContent = get('qrL1', 'Escaneá e inscribite');
    $('qrL2').textContent = get('qrL2', 'Ciclo 2027');
    $('qrPie').textContent = get('qrPie', '-60%');

    $('tLabel').textContent = get('etiqueta', D.etiqueta);
    $('tLabel').style.display = $('tLabel').textContent ? '' : 'none';
    buildTicker();
    clock();
  }

  /* ---------- reloj, fecha, timecode, cuenta regresiva ---------- */
  const pad = n => String(n).padStart(2, '0');
  const t0 = performance.now();
  function clock() {
    const d = new Date();
    $('hh').textContent = pad(d.getHours()); $('mm').textContent = pad(d.getMinutes());
    $('sec').style.width = (d.getSeconds() / 59 * 100) + '%';
    $('date').textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
    if (target && $('countNum')) {
      const left = Math.max(0, Math.round((target - Date.now()) / 1000));
      $('countNum').innerHTML = left >= 3600
        ? `${Math.floor(left / 3600)}<i>:</i>${pad(Math.floor(left / 60) % 60)}<i>:</i>${pad(left % 60)}`
        : `${pad(Math.floor(left / 60))}<i>:</i>${pad(left % 60)}`;
      if (left === 0 && !$('count').classList.contains('done')) {
        $('count').classList.add('done');
        $('countLbl').textContent = get('alTerminar', 'En instantes');
      }
    }
    if ($('endTime')) $('endTime').textContent = `${pad(loadTime.getHours())}:${pad(loadTime.getMinutes())} hs`;
  }
  function timecode(now) {
    const ms = now - t0, s = Math.floor(ms / 1000);
    $('tcode').textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}:${pad(Math.floor((ms % 1000) / 1000 * 60))}`;
    requestAnimationFrame(timecode);
  }
  setInterval(clock, 250); requestAnimationFrame(timecode);

  /* ---------- escucha al panel ---------- */
  let started = false, lastKey = '';
  function onState(s) {
    if (!s) return;
    const p = pick(s);
    const key = JSON.stringify(p) + '|' + ((s.replay && s.replay[escena]) || '');
    if (key === lastKey) return;          // sin cambios: no se toca nada (no hay parpadeos)
    lastKey = key; panel = p;
    if (started) render();
  }
  try { const bc = new BroadcastChannel('lametro-escenas'); bc.onmessage = e => e.data && e.data.escenas && onState(e.data.escenas); } catch {}
  addEventListener('storage', e => { if (e.key === SKEY && e.newValue) try { onState(JSON.parse(e.newValue)); } catch {} });
  addEventListener('message', e => { if (e.data && e.data.escenas) onState(e.data.escenas); });
  try { onState(JSON.parse(localStorage.getItem(SKEY))); } catch {}

  // Red: Apps Script, canal "escenas"
  const API = P.get('api') || DEFAULT_API_URL || (() => { try { return localStorage.getItem(AKEY) || ''; } catch { return ''; } })();
  const useApi = !!API && !isPreview;
  let remoteVersion = null, delay = POLL_MS;
  async function pollOnce() {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    try {
      const u = API + (API.includes('?') ? '&' : '?') + `t=${Date.now()}&canal=escenas&src=escena`;
      const j = await (await fetch(u, { cache: 'no-store', redirect: 'follow', signal: ctl.signal })).json();
      if (j && j.ok && j.state && j.versionId !== remoteVersion) { remoteVersion = j.versionId; onState(j.state); }
      delay = POLL_MS;
    } catch { delay = Math.min(delay * 2, 15000); }
    finally { clearTimeout(to); }
  }
  async function pollLoop() { await pollOnce(); setTimeout(pollLoop, delay); }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(async () => {
    if (useApi) await Promise.race([pollOnce(), new Promise(r => setTimeout(r, 3000))]);
    started = true; render();
    if (useApi) setTimeout(pollLoop, delay);
  });
})();
</script>
</body>
